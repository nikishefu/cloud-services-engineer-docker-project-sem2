name: momo-store

services:
  backend:
    build: ./backend
    ports:
      - "8081:8081"

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:8081
    ports:
      - "80:8080"
    volumes:
      - nginx_cache:/var/cache/nginx
    depends_on:
      backend:
        condition: service_healthy

volumes:
  nginx_cache:
