name: momo-store

services:
  backend-dev:
    profiles:
      - dev
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8081}:8081"
    networks:
      app-network-dev:
        aliases:
          - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  frontend-dev:
    profiles:
      - dev
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:${BACKEND_PORT:-8081}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app-network-dev
    volumes:
      - nginx_cache_dev:/var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    depends_on:
      backend-dev:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M


  backend:
    profiles:
      - prod
    build: ./backend
    restart: unless-stopped
    networks:
      - app-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  frontend:
    profiles:
      - prod
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: /api
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    networks:
      - app-network
    volumes:
      - nginx_cache:/var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  app-network:
  app-network-dev:

volumes:
  nginx_cache:
  nginx_cache_dev:
