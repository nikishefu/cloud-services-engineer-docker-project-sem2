name: momo-store

services:
  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - app-network
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  frontend:
    build:
      context: ./frontend
      args:
        VUE_APP_API_URL: http://localhost:8081
    restart: unless-stopped
    ports:
      - "80:8080"
    networks:
      - app-network
    volumes:
      - nginx_cache:/var/cache/nginx
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

networks:
  app-network:

volumes:
  nginx_cache:
